<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RaccDrop - Smugglo Edition</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #121212;
      color: #e0e0e0;
      text-align: center;
      padding: 40px;
    }
    .container {
      max-width: 500px;
      margin: auto;
      background: #1e1e1e;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(0,255,255,0.1);
    }
    h1 {
      font-size: 1.8em;
      margin-bottom: 10px;
      color: #00e5ff;
    }
    p {
      margin: 10px 0;
    }
    input, select, button {
      width: 100%;
      padding: 10px;
      margin:      font-size: 1em;
      border-radius: 6px;
      border: 1px solid #555;
      background-color: #2c2c2c;
      color: #e0e0e0;
    }
    button {
      background-color: #00e5ff;
      color: #121212;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover {
      background-color: #00bcd4;
    }
    a {
      color: #80d8ff;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🦝 RaccDrop - Hide Your Trash</h1>
    <p>Select your shiny file and choose how to disguise it:</p>
    <input type="file" id="fileInput" />
    <select id="method">
      <option value="css">Hide the paws in CSS</option>
      <option value="xor">Encrypt trash with XOR</option>
      <option value="aes">Lock it with AES</option>
      <option value="base64">Wrap in Base64</option>
      <option value="hex">Hexify the junk</option>
    </select>
    <button onclick="generateHTML()">Smuggle It!</button>
    <p id="status"></p>
  </div>

  <script>
    const randomKey = (l = 16) =>
      [...Array(l)].map(() =>
        "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789".charAt(Math.floor(Math.random() * 62))
      ).join('');

    const toHex = str =>
      [...str].map(c => c.charCodeAt(0).toString(16).padStart(2, '0')).join('');

    const xorEnc = (d, k) =>
      btoa([...d].map((c, i) => String.fromCharCode(c.charCodeAt(0) ^ k.charCodeAt(i % k.length))).join(''));

    const xorDec = (d, k) =>
      atob(d).split('').map((c, i) => String.fromCharCode(c.charCodeAt(0) ^ k.charCodeAt(i % k.length))).join('');

    async function aesEnc(data, key) {
      const enc = new TextEncoder(), iv = crypto.getRandomValues(new Uint8Array(12));
      const k = await crypto.subtle.importKey('raw', enc.encode(key), { name: 'AES-GCM' }, false, ['encrypt']);
      const e = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, k, enc.encode(data));
      return btoa(String.fromCharCode(...iv, ...new Uint8Array(e)));
    }

    async function aesDec(data, key) {
      const raw = atob(data),
        iv = new Uint8Array([...raw.slice(0, 12)].map(c => c.charCodeAt(0))),
        encData = new Uint8Array([...raw.slice(12)].map(c => c.charCodeAt(0)));
      const k = await crypto.subtle.importKey('raw', new TextEncoder().encode(key), { name: 'AES-GCM' }, false, ['decrypt']);
      const dec = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, k, encData);
      return new TextDecoder().decode(dec);
    }

    async function generateHTML() {
      const file = document.getElementById('fileInput').files[0];
      const method = document.getElementById('method').value;
      const key = randomKey();

      if (!file) {
        document.getElementById('status').innerText = "🦝 No trash selected!";
        return;
      }

      const reader = new FileReader();
      reader.onload = async () => {
        let data = reader.result;
        if (method === 'aes') data = await aesEnc(data, key);
        if (method === 'xor') data = xorEnc(data, key);
        if (method === 'hex') data = toHex(data);
        if (method === 'base64') data = btoa(data);
        if (method === 'css') data = `<div id="data" data-file="${btoa(data)}"></div>`;

        const escapedData = data.replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '\\"');
        const genHTML = `<!DOCTYPE html><html><body>${data}<script>
(async()=>{
let d="${escapedData}";
${method === 'aes' ? `d=await(${aesDec.toString()})(d,"${key}");` : ''}
${method === 'xor' ? `d=(${xorDec.toString()})(d,"${key}");` : ''}
${method === 'hex' ? `d=decodeURIComponent(d.replace(/(..)/g,'%$1'));` : ''}
${method === 'base64' ? `d=atob(d);` : ''}
${method === 'css' ? `d=atob(document.getElementById('data').dataset.file);` : ''}
const l=document.createElement('a');l.href=d;l.download='${file.name}';document.body.appendChild(l);l.click();l.remove();
})();<\/script></body></html>`;

        const blob = new Blob([genHTML], { type: 'text/html' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = `raccdrop_${file.name}.html`;
        link.click();
        document.getElementById('status').innerText = '🦝 Trash smuggled successfully!';
      };
      reader.readAsDataURL(file);
    }
  </script>
</body>
</html>
